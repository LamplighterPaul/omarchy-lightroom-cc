name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax and unit tests
        run: make check
      - name: Remind that Wine compatibility is not covered
        run: |
          echo "These checks cover the launcher, decoder and diagnostics syntax only."
          echo "They do not run Adobe applications, Wine, Proton or GPU validation."
